<!doctype html>
<html lang="en">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Patrick+Hand&family=Quicksand:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <title>My Fridge – Saucepal</title>
    <link rel="icon" type="image/x-icon" href="images/saucepal-favicon.png" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>

  <body>
    <!-- MENU -->
    <header class="menu">
      <div class="menu-container">
        <a class="logo-container" href="index.html">
          <img
            class="logo"
            src="images/saucepal-logo.svg"
            alt="Saucepal home"
          />
        </a>
        <ul class="menu-links">
          <li class="menu-element">
            <a href="index.html">Home</a>
          </li>
          <li class="menu-element active">
            <a href="fridge.html" aria-current="page">My Fridge</a>
          </li>
          <li class="menu-element">Recipes</li>
          <li class="menu-element">About</li>
        </ul>
      </div>
    </header>

    <main>
      <div class="page-header-dark">
        <div class="page-wrapper">
          <div class="form-intro-container">
            <div class="form-intro">
              <h1>
                Happy
                <span class="handwritten"
                  ><span id="day-of-week">weekday</span></span
                >!
              </h1>
              <br />
              <h2>Let us know what you have in your fridge.</h2>
              <p>We will try to match your ingredients with recipes.</p>
            </div>
            <div class="fridge-svg">
              <!--Image source: https://undraw.co/search/food-->
              <img src="images/fridge.svg" alt="English breakfast" />
            </div>
          </div>
          <form id="add-form" class="quick-add" novalidate>
            <div class="field">
              <label for="ingredient">
                Ingredient name <span class="required"><i>(Required)</i></span>
              </label>
              <input
                type="text"
                id="ingredient"
                name="ingredient"
                placeholder="e.g. tomatoes"
              />
              <div class="form-error" id="ingredientError"></div>
            </div>

            <div class="field">
              <label for="quantity">Quantity</label>
              <div class="quantity-field">
                <input
                  type="number"
                  id="quantity"
                  name="quantity"
                  step="0.1"
                  min="0"
                  placeholder="0"
                />
                <select id="unit" name="unit" aria-label="Unit">
                  <option value="kg">kg</option>
                  <option value="g">g</option>
                  <option value="units">units</option>
                </select>
              </div>
              <div class="form-error" id="quantityError"></div>
            </div>

            <div class="field">
              <label for="category">Category</label>
              <select id="category" name="category">
                <option value="Other">Choose one</option>
                <option value="Fruit & veg">Fruit &amp; veg</option>
                <option value="Meat & fish">Meat &amp; fish</option>
                <option value="Dairy & eggs">Dairy &amp; eggs</option>
                <option value="Store cupboard">Store cupboard</option>
                <option value="Frozen">Frozen</option>
                <option value="Other">Other</option>
              </select>
              <div class="form-error"></div>
            </div>

            <button type="submit" class="primary-button">Add to fridge</button>
          </form>
        </div>
      </div>
      <div class="fridge-element">
        <div class="page-wrapper">
          <div class="fridge-header">
            <h3 id="fridge-count"></h3>
            <button type="button" id="remove-all" class="error-button" hidden>
              Remove all
            </button>
          </div>
          <div class="fridge-empty" id="fridge-empty" hidden>
            <div class="icon-with-background">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                width="32"
                height="32"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path
                  d="M5 6a4 4 0 0 1 4-4h6a4 4 0 0 1 4 4v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6Z"
                />
                <path d="M5 10h14" />
                <path d="M15 7v6" />
              </svg>
            </div>
            <h4>Your fridge is empty</h4>
            <p>Add your first ingredient above.</p>
          </div>
          <div id="fridge-list"></div>
        </div>
      </div>
    </main>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
