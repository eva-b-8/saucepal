<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recipes - Saucepal</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- MENU -->
    <header class="menu">
      <div class="menu-container">
        <a class="logo-container" href="index.html">
          <img
            class="logo"
            src="images/saucepal-logo.svg"
            alt="Saucepal home"
          />
        </a>
        <ul class="menu-links">
          <li class="menu-element">
            <a href="index.html">Home</a>
          </li>
          <li class="menu-element">
            <a href="fridge.html">My Fridge</a>
          </li>
          <li class="menu-element active">
            <a href="recipes.html" aria-current="page">Recipes</a>
          </li>
          <li class="menu-element">
            <a href="about.html">About</a>
          </li>
        </ul>
      </div>
    </header>

    <form id="search-form">
      <div class="meal-search">
        <input
          type="text"
          id="text-search"
          name="meal"
          placeholder="e.g. Spaghetti Bolognese"
        />
        <span id="clear-search">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-x preview-icon"
          >
            <path d="M18 6 6 18" />
            <path d="m6 6 12 12" />
          </svg>
        </span>
      </div>
      <button type="submit" class="primary-button">Search</button>
    </form>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="recipes.js"></script>
  </body>
</html>
