<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recipes - Saucepal</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- MENU -->
    <header class="menu">
      <div class="menu-container">
        <a class="logo-container" href="index.html">
          <img
            class="logo"
            src="images/saucepal-logo.svg"
            alt="Saucepal home"
          />
        </a>
        <ul class="menu-links">
          <li class="menu-element">
            <a href="index.html">Home</a>
          </li>
          <li class="menu-element">
            <a href="fridge.html">My Fridge</a>
          </li>
          <li class="menu-element active">
            <a href="recipes.html" aria-current="page">Recipes</a>
          </li>
          <li class="menu-element">
            <a href="about.html">About</a>
          </li>
        </ul>
      </div>
    </header>

    <main>
      <div class="page-header-light">
        <div class="page-wrapper">
          <nav aria-label="Breadcrumb" class="breadcrumb">
            <ol>
              <li><a href="index.html">Home</a></li>
              <li><a href="fridge.html">My Fridge</a></li>
              <li><span aria-current="page">Recipes</span></li>
            </ol>
          </nav>
          <div class="form-intro-container">
            <div class="form-intro">
              <h1>Try something <span class="handwritten">delicious</span>!</h1>
              <br />
              <h2>Search for meals and ingredients.</h2>
              <p>You can also start by browsing the categories below.</p>
            </div>
            <div class="header-svg">
              <!--Image source: https://undraw.co/search/food-->
              <img src="images/cooking.svg" alt="English breakfast" />
            </div>
          </div>
          <form id="search-form" class="search-box">
            <div class="meal-search">
              <input
                type="text"
                id="text-search"
                name="meal"
                placeholder="e.g. Spaghetti Bolognese"
              />
              <button type="button" id="clear-search" aria-label="Clear search">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="lucide lucide-x preview-icon"
                >
                  <path d="M18 6 6 18" />
                  <path d="m6 6 12 12" />
                </svg>
              </button>
            </div>
            <button type="submit" class="primary-button">Search</button>
          </form>
        </div>
      </div>
      <div class="empty-state" id="empty-state" hidden>
        <div class="icon-with-background">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            width="32"
            height="32"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M2 12h20" />
            <path d="M20 12v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-8" />
            <path d="m4 8 16-4" />
            <path
              d="m8.86 6.78-.45-1.81a2 2 0 0 1 1.45-2.43l1.94-.48a2 2 0 0 1 2.43 1.46l.45 1.8"
            />
          </svg>
        </div>
        <h4>No matching recipes</h4>
        <p>Please search for a meal above.</p>
      </div>
    </main>

    <div class="category-wrapper"></div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="recipes.js"></script>
  </body>
</html>
