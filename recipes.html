<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recipes - Saucepal</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- MENU -->
    <header class="menu">
      <div class="menu-container">
        <a class="logo-container" href="index.html">
          <img
            class="logo"
            src="images/saucepal-logo.svg"
            alt="Saucepal home"
          />
        </a>
        <ul class="menu-links">
          <li class="menu-element">
            <a href="index.html">Home</a>
          </li>
          <li class="menu-element">
            <a href="fridge.html">My Fridge</a>
          </li>
          <li class="menu-element active">
            <a href="recipes.html" aria-current="page">Recipes</a>
          </li>
          <li class="menu-element">
            <a href="about.html">About</a>
          </li>
        </ul>
      </div>
    </header>

    <main>
      <div class="page-header-light">
        <div class="page-wrapper">
          <nav aria-label="Breadcrumb" class="breadcrumb">
            <ol>
              <li><a href="index.html">Home</a></li>
              <li><a href="fridge.html">My Fridge</a></li>
              <li><span aria-current="page">Recipes</span></li>
            </ol>
          </nav>
          <div class="form-intro-container">
            <div class="form-intro">
              <h1>Hungry?</h1>
              <br />
              <h2>Let us know what you have in your fridge.</h2>
              <p>We will try to match your ingredients with recipes.</p>
            </div>
            <div class="fridge-svg">
              <!--Image source: https://undraw.co/search/food-->
              <img src="images/fridge.svg" alt="English breakfast" />
            </div>
          </div>
          <form id="search-form" class="search-box">
            <div class="meal-search">
              <input
                type="text"
                id="text-search"
                name="meal"
                placeholder="e.g. Spaghetti Bolognese"
              />
              <span id="clear-search">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="lucide lucide-x preview-icon"
                >
                  <path d="M18 6 6 18" />
                  <path d="m6 6 12 12" />
                </svg>
              </span>
            </div>
            <button type="submit" class="primary-button">Search</button>
          </form>
        </div>
      </div>
      <div class="empty-state" id="empty-state" hidden>
        <div class="icon-with-background">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            width="32"
            height="32"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path
              d="M5 6a4 4 0 0 1 4-4h6a4 4 0 0 1 4 4v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6Z"
            />
            <path d="M5 10h14" />
            <path d="M15 7v6" />
          </svg>
        </div>
        <h4>No matching recipes</h4>
        <p>Please search for a meal above.</p>
      </div>
    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="recipes.js"></script>
  </body>
</html>
